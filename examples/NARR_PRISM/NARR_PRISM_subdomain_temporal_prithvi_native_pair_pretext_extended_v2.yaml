      - encoder
      lr_scale: 0.1
    - epoch: 10
      modules:
      - backbone
      lr_scale: 0.05
    lr_temporal: 0.0002
    lr_decoder: 5.0e-05
    lr_encoder: 1.0e-05
    lr_backbone: 1.0e-06
  losses:
    per_frame_weight: 1.0
    predictand_weights:
      ppt: 1.0
      tmax: 1.0
      tmin: 1.0
    tendency:
      enabled: true
      weight: 0.15
      normalize_by_interval: true
      predictands:
        ppt: 0.5
        tmax: 1.0
        tmin: 1.0
    accumulation:
      enabled: true
      weight: 0.1
      windows:
      - 3
      - 5
      predictands:
      - ppt
    occurrence:
      enabled: true
      weight: 0.05
      variable: ppt
      wet_threshold: 1.0
      transition_weight: 0.5
      softness: 0.5
    lag_autocorr:
      enabled: false
      weight: 0.0
      lags:
      - 1
      - 2
      min_samples: 512
  refinement:
    temporal_conditioning: none
    noise: iid_per_frame
    noise_rho: 0.0
    ensemble_size: 1
    per_member_state: true
  inference:
    chunk_length: 32
    chunk_warmup: 5
    carry_state_across_chunks: true
    write_netcdf: true
    output_dir: ./examples/NARR_PRISM/runs_temporal/NARR_PRISM_subdomain_temporal_prithvi_native_pair_pretext_extended_v2/inference
  evaluation:
    event_paired: true
    wet_threshold: 1.0
    autocorr_lags:
    - 1
    - 2
    - 3
    - 5
    accumulation_windows:
    - 3
    - 5
    deseasonalize: true
    boundary_width: 8
    block_bootstrap_length: 30
    n_bootstrap: 500
  seed: 1234
