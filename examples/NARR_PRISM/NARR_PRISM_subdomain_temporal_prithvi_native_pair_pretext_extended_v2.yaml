    reset_on_discontinuity: true
    carry_across_windows: false
    detach_between_chunks: true
    tbptt_chunk: 3
  time_features:
    include_hour_of_day: auto
    include_lead_time: false
  latent:
    site: bottleneck
    hidden_channels: 256
    adapter_init_gate: 0.001
    norm: group
    groups: 8
    time_feature_hidden: 64
  recurrent:
    cell: convgru
    kernel_size: 3
    num_layers: 2
    dilations:
    - 1
    - 2
  mamba:
    implementation: reference
    d_state: 16
    d_conv: 4
    expand: 2
    n_layers: 2
    headdim: 32
    spatial_mixing: conv3x3
    scan_axis: time
    time_scale_from_metadata: true
    dt_min: 0.001
    dt_max: 0.1
  native_pair:
    history_offsets:
    - 1
    history_mode: real
    time_conditioning: true
    time_conditioning_gate_init: 0.001
    pretext:
