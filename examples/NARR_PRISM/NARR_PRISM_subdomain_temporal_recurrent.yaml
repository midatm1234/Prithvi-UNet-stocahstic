# =============================================================================
# NARR -> PRISM California subdomain -- TEMPORAL, recurrent (ConvGRU) backend
# =============================================================================
# Derived from examples/NARR_PRISM/NARR_PRISM_subdomain.yaml, which is unchanged
# and remains runnable.
#
# Preserved verbatim from the source case:
#   * case identity            : case_name narr_prism_California (this also
#                                locates the preprocessed inputs under
#                                preprocessed/<case_name>/<mode>/)
#   * ALL THREE targets        : ppt, tmax, tmin  -- tmin is retained; target
#                                variables come from the config, never from a
#                                filename
#   * predictors and ordering  : shum/uwnd/vwnd/air/hgt at 500/700/850, then
#                                elev, then the 16 predictor masks (31 channels)
#   * static handling          : num_static_channels 0 -- elevation and masks
#                                travel in the DYNAMIC channel list, so no
#                                separate static tensor is split off
#   * geographic subset        : lat 32.55..41.075, lon -124.45..-115.925
#   * data paths and calendar  : /data2/NARR, /data/PRISM, Gregorian daily
#   * normalization            : per-predictand blocks, scalars_with_H
#   * periods                  : train 1996-2013, valid 2014-2015, test 2016-2025
#   * model geometry           : windowed_local attention, pre_conv_add residual,
#                                dynamic decoder skips, hurdle precipitation head
#   * tiled training geometry   : 256-px cores with a 32-px predictor halo
#
# New: the `temporal:` block. Outputs go to a separate runs_temporal/... tree so
# nothing from the existing case is overwritten.
#
# DATA AVAILABILITY: the NARR and PRISM archives and the narr_prism_California
# Phase-1 checkpoint are NOT present on the machine this branch was developed on
# (examples/NARR_PRISM/preprocessed/ and .../experiments/ are both empty). This
# config is schema-complete and every key in it is consumed and validated by real
# code, but it has NOT been executed end-to-end here. `describe` reports the
# missing preprocessed directory explicitly rather than failing obscurely. See
# docs/temporal_model_results.md for the exact commands to run once the archives
# are mounted.
#
# TASK: causal, same-day, sequence-conditioned downscaling. Zero
# predictor-to-target lead time, exactly as in the source case.
#
# EVENT ALIGNMENT: NARR reanalysis predictors and PRISM observed targets on the
# same date describe the same physical weather (reanalysis is observation-
# constrained), so day-by-day losses and event-paired metrics are appropriate.
# Re-run the lag-correlation check -- the one that confirmed alignment for the SA
# case -- once the data is available.
# =============================================================================

data:
  type: narr_prism
  predictor_dir: /data2/NARR/data/subset
  target_dir: /data/PRISM/prism_daily_800m_an
  target_variables:
  - ppt
  - tmax
  - tmin
  predictor_variables:
    shum:
    - 500
    - 700
    - 850
    uwnd:
    - 500
    - 700
    - 850
    vwnd:
    - 500
    - 700
    - 850
    air:
    - 500
    - 700
    - 850
    hgt:
    - 500
    - 700
    - 850
  static_elevation_file: ./examples/NARR_PRISM/prism_elevation.nc
  static_elevation_var: null
  input_vars:
  - shum_500
  - shum_700
  - shum_850
  - uwnd_500
  - uwnd_700
  - uwnd_850
  - vwnd_500
  - vwnd_700
  - vwnd_850
  - air_500
  - air_700
  - air_850
  - hgt_500
  - hgt_700
  - hgt_850
  - elev
  - mask_shum_500
  - mask_shum_700
  - mask_shum_850
  - mask_uwnd_500
  - mask_uwnd_700
  - mask_uwnd_850
  - mask_vwnd_500
  - mask_vwnd_700
  - mask_vwnd_850
  - mask_air_500
  - mask_air_700
  - mask_air_850
  - mask_hgt_500
  - mask_hgt_700
  - mask_hgt_850
  - mask_elev
  input_levels:
  - 1
  input_surface_vars: []
  vertical_pres_vars:
  - shum_500
  - shum_700
  - shum_850
  - uwnd_500
  - uwnd_700
  - uwnd_850
  - vwnd_500
  - vwnd_700
  - vwnd_850
  - air_500
  - air_700
  - air_850
  - hgt_500
  - hgt_700
  - hgt_850
  - elev
  - mask_shum_500
  - mask_shum_700
  - mask_shum_850
  - mask_uwnd_500
  - mask_uwnd_700
  - mask_uwnd_850
  - mask_vwnd_500
  - mask_vwnd_700
  - mask_vwnd_850
  - mask_air_500
  - mask_air_700
  - mask_air_850
  - mask_hgt_500
  - mask_hgt_700
  - mask_hgt_850
  - mask_elev
  input_level_pres:
  - 1
  vertical_level1_vars: []
  input_level1: []
  vertical_level2_vars: []
  input_level2: []
  other: []
  output_vars:
  - ppt
  - tmax
  - tmin
  use_static: true
  # Single source of truth: training/scalars/inference consume only the daily
  # products generated under preprocessed/<case_name>/<mode>.
  use_preprocessed: true
  preprocessed_dir: ./examples/NARR_PRISM/preprocessed
  scalar_dir: ./examples/NARR_PRISM/scalars_with_H
  scalers:
    inputs_mean: ./examples/NARR_PRISM/scalars_with_H/inputs_mean.npy
    inputs_std: ./examples/NARR_PRISM/scalars_with_H/inputs_std.npy
    targets_mean: ./examples/NARR_PRISM/scalars_with_H/targets_mean.npy
    targets_std: ./examples/NARR_PRISM/scalars_with_H/targets_std.npy
  # Match inference geometry: overlapping 256-pixel output cores are trained
  # with 32 pixels of predictor context on every side.
  train_crop_size_lat: 256
  train_crop_size_lon: 256
  training_spatial_sampling: tiled
  training_tile_stride_lat: 192
  training_tile_stride_lon: 192
  training_halo_lat: 32
  training_halo_lon: 32
  min_valid_target_fraction: 1.0e-04
  max_crop_retries: 32
  skip_empty_target_tiles: true
  n_input_timestamps: 1
  # NARR is curvilinear; use piecewise-linear Delaunay barycentric weights.
  regrid_method: linear
  scalar_stride: 1
  spatial_subset:
    enabled: true
    # Edit these inclusive bounds to choose the training/inference subdomain.
    # PRISM grid range in this dataset is roughly:
    #   latitude  24.07 .. 49.93
    #   longitude -125.02 .. -66.48
    lat_min: 32.55
    lat_max: 41.075
    lon_min: -124.45
    lon_max: -115.925
dates:
  training:
    start: '1996-01-01'
    end: '2013-12-31'
  validation:
    start: '2014-01-01'
    end: '2015-12-31'
  inference:
    start: '2016-01-01'
    end: '2025-12-31'
normalization:
  predictor_method: standardize
  # Per-channel (global) normalization: one mean/std per variable, NOT per
  # lat/lon grid cell. Per-gridpoint scalers bake a low-resolution field into
  # the z-score and produce blocky downscaled output.
  predictor_mode: global
  target_method: per_variable
predictands:
  ppt:
    name: ppt
    allow_negative_value: false
    nonnegativity:
      enabled: true
      method: softplus
    scaling:
      method: divide_only
      scale_stat: p95
      fixed_scale: null
    normalization:
      method: divide_only
      mode: global
      eps_std: 1.0e-06
      allow_negative_value: false
  tmax:
    name: tmax
    allow_negative_value: false
    nonnegativity:
      enabled: false
      method: none
    scaling:
      method: zscore
      scale_stat: mean
      fixed_scale: null
    normalization:
      method: standardize
      mode: gridpoint
      eps_std: 1.0e-06
  tmin:
    name: tmin
    allow_negative_value: false
    nonnegativity:
      enabled: false
      method: none
    scaling:
      method: zscore
      scale_stat: mean
      fixed_scale: null
    normalization:
      method: standardize
      mode: gridpoint
      eps_std: 1.0e-06
model:
  input_mu: ./examples/NARR_PRISM/scalars_with_H/inputs_mean.npy
  input_sigma: ./examples/NARR_PRISM/scalars_with_H/inputs_std.npy
  target_mu: ./examples/NARR_PRISM/scalars_with_H/targets_mean.npy
  target_sigma: ./examples/NARR_PRISM/scalars_with_H/targets_std.npy
  token_size:
  - 1
  - 1
  embed_dim: 1024
  n_blocks_encoder: 8
  mlp_multiplier: 4
  n_heads: 16
  dropout_rate: 0.0
  drop_path: 0.0
  residual: none
  num_static_channels: 0
  downscaling_patch_size:
  - 2
  - 2
  downscaling_embed_dim: 512
  encoder_decoder_type: conv
  encoder_decoder_upsampling_mode: bilinear
  encoder_decoder_kernel_size_per_stage:
  - - 3
  - - 3
  encoder_decoder_scale_per_stage:
  - - 2
  - - 3
  encoder_decoder_conv_channels: 128
  residual_connection: true
  # Correct the historical UNET bug that discarded the shallow residual before
  # conv_after_backbone. Legacy configs omit this key to preserve old checkpoints.
  backbone_residual_mode: pre_conv_add
  encoder_shift: false
  unet: true
  # Elevation and predictor masks already live on the PRISM grid in x. Route
  # those native-resolution features through the UNET skips instead of zeros.
  decoder_skip_source: dynamic
  # Bound attention to globally aligned 16x16 mask units. Legacy global
  # attention changes with tile contents and cannot satisfy tiled/full equality.
  backbone_attention_scope: windowed_local
  decoder_upsampling_mode: bilinear
  output_scaler_resize_mode: bilinear
  output_scaler_align_corners: false
  unet_upsample_scales:
  - 2
  - 2
  - 2
  unet_decoder_kernel_size:
  - 3
  - 3
  - 3
job_id: NARR_PRISM_temporal_recurrent
# case_name is deliberately unchanged: it is the case identity AND it locates
# the preprocessed inputs under preprocessed/<case_name>/<mode>/. New outputs are
# separated via path_experiment / checkpoint_dir / run_dir below instead.
case_name: narr_prism_California
type_training: full_dataset
batch_size: 1
num_epochs: 20
dl_num_workers: 2
dl_prefetch_size: 1
learning_rate: 1.0e-05
max_grad_norm: 1.0
limit_steps_train: 100000
limit_steps_valid: 100
min_lr: 1.0e-06
max_lr: 0.0001
warm_up_steps: 0
mask_unit_size:
- 16
- 16
mask_ratio_inputs: 0.0
mask_ratio_targets: 0.0
max_batch_size: 4
path_experiment: ./examples/NARR_PRISM/runs_temporal/narr_prism_California_temporal_recurrent
checkpoint_dir: ./examples/NARR_PRISM/runs_temporal/narr_prism_California_temporal_recurrent/checkpoints
run_dir: ./examples/NARR_PRISM/runs_temporal/narr_prism_California_temporal_recurrent/runs
path_model_weights: ./granite-geospatial-wxc-downscaling/ECCC/weights/best_rmse_UNET.pt
backbone_use: true
backbone_freeze: false
backbone_prefix: encoder.
finetune_w_static: false
strict_matching: false
device_target: cuda
distributed_strategy: none
fsdp_precision: bf16
fsdp_min_num_params: 5000000
backbone_gradient_checkpointing: true
skip_activation_offload: true
training:
  distributed: none
  num_gpus: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 32
  auto_resume_if_checkpoint_exists: false
gradient_accumulation_steps: 32
loss:
  base: rmse
  predictands:
    ppt:
      distribution_loss:
        enabled: true
        method: cdf
        weight: 0.05
        use_mean: true
        use_std: true
        use_skewness: true
        bins: 100
    tmax:
      distribution_loss:
        enabled: true
        method: cdf
        weight: 0.05
        use_mean: true
        use_std: true
        use_skewness: false
        bins: 100
    tmin:
      distribution_loss:
        enabled: true
        method: cdf
        weight: 0.05
        use_mean: true
        use_std: true
        use_skewness: false
        bins: 100
  spatial_gradient:
    enabled: true
    weight: 0.03
    predictands:
      tmax: 1.0
      tmin: 1.0
      ppt: 0.25
    precipitation_wet_only: true
    precipitation_wet_threshold: 0.1
  use_gradient_loss: true
  gradient_loss_weight: 0.03
  use_tv_loss: false
  tv_loss_weight: 0.0005
  use_multiscale_loss: true
  multiscale_loss_weight: 0.015
  tv:
    enabled: false
    weight: 0.0005
    predictands:
      ppt: 0.1
      tmax: 0.3
      tmin: 0.3
  multiscale:
    enabled: true
    weight: 0.015
    scales:
    - 2
    - 4
    loss_type: l1
  boundary_continuity:
    enabled: true
    weight: 0.01
    predictands:
      ppt: 0.2
      tmax: 1.0
      tmin: 1.0
    stride_lat: 16
    stride_lon: 16
    match_target: true
inference:
  checkpoint_path: null
  output_dir: ./examples/NARR_PRISM/runs_temporal/narr_prism_California_temporal_recurrent/inference
  mixed_precision: true
  mixed_precision_dtype: bfloat16
  boundary_mitigation:
    enabled: true
    tile_size:
    - 256
    - 256
    overlap:
    - 64
    - 64
    halo:
    - 32
    - 32
    blend_mode: hann
    deblock:
      enabled: false
      boundary_width: 2
      strength: 0.1
      kernel_size: 3
    force_full_frame: false
    blend_window: hann
    blend_sigma: 0.35
    use_seam_deblocking: false
    seam_deblocking_strength: 0.1
  inference_tile_size:
  - 256
  - 256
  inference_overlap:
  - 64
  - 64
  inference_halo:
  - 32
  - 32
  inference_blend_window: hann
  inference_blend_sigma: 0.35
  diagnostics:
    enabled: true
    max_days: 1
    predictor_channels:
    - 0
  force_full_frame: false
  use_seam_deblocking: false
  seam_deblocking_strength: 0.1
precip_model: hurdle
precip_wet_threshold: 0.01
precip_occurrence_prob_threshold: 0.5
precip_lambda_occurrence: 1.0
precip_lambda_amount: 1.0
precip_amount_loss_type: smoothl1
# Weight loading is driven by temporal.init_from_spatial_checkpoint /
# temporal.resume_from_temporal_checkpoint, so the legacy resume path is off.
resume_training: false
resume_checkpoint_path: null
auto_resume_if_checkpoint_exists: false

# =============================================================================
# TEMPORAL BLOCK
# =============================================================================
temporal:
  enabled: true
  backend: recurrent
  mode: downscaling
  causal: true
  lead_time_days: 0.0
  cadence_days: 1.0

  # --- sequence geometry -----------------------------------------------------
  # context_length = 5 here, shorter than the SA case's 7, for a stated reason:
  # the PRISM target crop is 256 x 256 against SA's 128 x 128, so each frame
  # costs roughly 4x as much and the U-Net bottleneck is 32 x 32 rather than
  # 16 x 16. Five frames keeps the memory footprint comparable.
  # The window length follows the same evidence as the SA case (daily cadence,
  # target memory concentrated in lags 1-3), but note that the equivalent
  # autocorrelation measurement has NOT been made on the PRISM California record
  # because that data is unavailable here. Re-measure and re-tune before drawing
  # scientific conclusions from this case.
  context_length: 5
  warmup_length: 1
  output_length: 4
  sequence_stride: 4        # == output_length, so training windows tile exactly

  state:
    init: zeros
    reset_on_discontinuity: true
    carry_across_windows: false
    detach_between_chunks: true
    # Bound backprop memory to 3 frames on the larger PRISM grid. Values carried
    # forward are unchanged; only the gradient path is truncated.
    tbptt_chunk: 3

  time_features:
    include_hour_of_day: auto   # PRISM daily -> correctly omitted
    include_lead_time: false

  latent:
    site: bottleneck            # [B, 1024, 32, 32] for a 256 x 256 crop
    hidden_channels: 256
    adapter_init_gate: 0.001
    norm: group
    groups: 8
    time_feature_hidden: 64

  recurrent:
    cell: convgru
    kernel_size: 3
    num_layers: 2
    dilations:
    - 1
    - 2

  mamba:
    implementation: reference
    d_state: 16
    d_conv: 4
    expand: 2
    n_layers: 2
    headdim: 32
    spatial_mixing: conv3x3
    scan_axis: time
    time_scale_from_metadata: true
    dt_min: 0.001
    dt_max: 0.1

  init_from_spatial_checkpoint: ./examples/NARR_PRISM/experiments/checkpoints/narr_prism_California/last.ckpt
  resume_from_temporal_checkpoint: null

  freeze:
    backbone: true
    encoder: true
    decoder: false
    unfreeze_schedule:
    - epoch: 3
      modules:
      - backbone
      lr_scale: 1.0
    lr_temporal: 0.0002
    lr_decoder: 0.00005
    lr_encoder: 0.00001
    lr_backbone: 0.000001

  losses:
    per_frame_weight: 1.0
    # Balanced across all three targets. Per-variable residuals are divided by
    # the training-set target sigma before weighting, so mm/day and kelvin
    # contribute comparably and no single variable can dominate.
    predictand_weights:
      ppt: 1.0
      tmax: 1.0
      tmin: 1.0
    tendency:
      # Matches the OBSERVED day-to-day change; not a smoothness penalty.
      enabled: true
      weight: 0.15
      normalize_by_interval: true
      predictands:
        ppt: 0.5
        tmax: 1.0
        tmin: 1.0
    accumulation:
      enabled: true
      weight: 0.10
      windows:
      - 3
      - 5
      predictands:
      - ppt
    occurrence:
      enabled: true
      weight: 0.05
      variable: ppt
      wet_threshold: 1.0
      transition_weight: 0.5
      softness: 0.5
    lag_autocorr:
      # Off during training for the same reason as the SA case: a 4-frame window
      # gives a 4-sample correlation estimate. Autocorrelation is evaluated on
      # the full multi-year test series instead.
      enabled: false
      weight: 0.0
      lags:
      - 1
      - 2
      min_samples: 512

  # Tmax/Tmin physical consistency (tmin <= tmax) is enforced automatically
  # whenever both variables are configured, as they are here. Only violations are
  # penalized, so a consistent pair contributes exactly zero.

  refinement:
    # 'none' preserves the existing per-date Phase-2 path and keeps all four
    # existing NARR/PRISM refinement checkpoints valid.
    temporal_conditioning: none
    noise: iid_per_frame
    noise_rho: 0.0
    ensemble_size: 1
    per_member_state: true

  inference:
    chunk_length: 32
    chunk_warmup: 5
    carry_state_across_chunks: true
    write_netcdf: true
    output_dir: ./examples/NARR_PRISM/runs_temporal/narr_prism_California_temporal_recurrent/inference

  evaluation:
    event_paired: true
    wet_threshold: 1.0
    autocorr_lags:
    - 1
    - 2
    - 3
    - 5
    accumulation_windows:
    - 3
    - 5
    deseasonalize: true
    # PRISM is NaN over ocean and outside CONUS; the boundary band is where
    # precipitation artefacts have previously appeared in this case.
    boundary_width: 8
    block_bootstrap_length: 30
    n_bootstrap: 500

  seed: 1234
