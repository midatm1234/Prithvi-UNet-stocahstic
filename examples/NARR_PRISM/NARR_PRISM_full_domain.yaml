data:
  type: narr_prism
  predictor_dir: /data2/NARR/data/subset
  target_dir: /data/PRISM/prism_daily_800m_an
  target_variables:
  - ppt
  - tmax
  - tmin
  predictor_variables:
    shum:
    - 500
    - 700
    - 850
    uwnd:
    - 500
    - 700
    - 850
    vwnd:
    - 500
    - 700
    - 850
    air:
    - 500
    - 700
    - 850
    hgt:
    - 500
    - 700
    - 850
  static_elevation_file: ./examples/NARR_PRISM/prism_elevation.nc
  static_elevation_var: null
  input_vars:
  - shum_500
  - shum_700
  - shum_850
  - uwnd_500
  - uwnd_700
  - uwnd_850
  - vwnd_500
  - vwnd_700
  - vwnd_850
  - air_500
  - air_700
  - air_850
  - hgt_500
  - hgt_700
  - hgt_850
  - elev
  - mask_shum_500
  - mask_shum_700
  - mask_shum_850
  - mask_uwnd_500
  - mask_uwnd_700
  - mask_uwnd_850
  - mask_vwnd_500
  - mask_vwnd_700
  - mask_vwnd_850
  - mask_air_500
  - mask_air_700
  - mask_air_850
  - mask_hgt_500
  - mask_hgt_700
  - mask_hgt_850
  - mask_elev
  input_levels:
  - 1
  input_surface_vars: []
  vertical_pres_vars:
  - shum_500
  - shum_700
  - shum_850
  - uwnd_500
  - uwnd_700
  - uwnd_850
  - vwnd_500
  - vwnd_700
  - vwnd_850
  - air_500
  - air_700
  - air_850
  - hgt_500
  - hgt_700
  - hgt_850
  - elev
  - mask_shum_500
  - mask_shum_700
  - mask_shum_850
  - mask_uwnd_500
  - mask_uwnd_700
  - mask_uwnd_850
  - mask_vwnd_500
  - mask_vwnd_700
  - mask_vwnd_850
  - mask_air_500
  - mask_air_700
  - mask_air_850
  - mask_hgt_500
  - mask_hgt_700
  - mask_hgt_850
  - mask_elev
  input_level_pres:
  - 1
  vertical_level1_vars: []
  input_level1: []
  vertical_level2_vars: []
  input_level2: []
  other: []
  output_vars:
  - ppt
  - tmax
  - tmin
  use_static: false
  preprocessed_dir: ./examples/NARR_PRISM/preprocessed
  scalar_dir: ./examples/NARR_PRISM/scalars_with_H
  scalers:
    inputs_mean: ./examples/NARR_PRISM/scalars_with_H/inputs_mean.npy
    inputs_std: ./examples/NARR_PRISM/scalars_with_H/inputs_std.npy
    targets_mean: ./examples/NARR_PRISM/scalars_with_H/targets_mean.npy
    targets_std: ./examples/NARR_PRISM/scalars_with_H/targets_std.npy
  input_size_lat: 32
  input_size_lon: 32
  # Full-domain coverage via deterministic fixed-size spatial tiles.
  # Edge tiles are shifted inward so every sample remains 256x256.
  target_size_lat: 256
  target_size_lon: 256
  train_crop_size_lat: 256
  train_crop_size_lon: 256
  training_spatial_sampling: tiled
  training_tile_stride_lat: 256
  training_tile_stride_lon: 256
  min_valid_target_fraction: 1.0e-04
  max_crop_retries: 32
  skip_empty_target_tiles: true
  downsample_factor: 8
  n_input_timestamps: 1
  regrid_method: bilinear
  scalar_stride: 1
  spatial_subset:
    enabled: false
    lat_min: null
    lat_max: null
    lon_min: null
    lon_max: null
dates:
  training:
    start: '1996-01-01'
    end: '2015-12-31'
  inference:
    start: '2016-01-01'
    end: '2025-12-31'
normalization:
  predictor_method: standardize
  # Per-channel (global) normalization: one mean/std per variable, NOT per
  # lat/lon grid cell. Per-gridpoint scalers bake a low-resolution field into
  # the z-score and produce blocky downscaled output.
  predictor_mode: global
  target_method: per_variable
predictands:
  ppt:
    name: ppt
    allow_negative_value: false
    nonnegativity:
      enabled: true
      method: softplus
    scaling:
      method: divide_only
      scale_stat: p95
      fixed_scale: null
    normalization:
      method: divide_only
      mode: global
      eps_std: 1.0e-06
      allow_negative_value: false
  tmax:
    name: tmax
    allow_negative_value: false
    nonnegativity:
      enabled: false
      method: none
    scaling:
      method: zscore
      scale_stat: mean
      fixed_scale: null
    normalization:
      method: standardize
      mode: global
      eps_std: 1.0e-06
  tmin:
    name: tmin
    allow_negative_value: false
    nonnegativity:
      enabled: false
      method: none
    scaling:
      method: zscore
      scale_stat: mean
      fixed_scale: null
    normalization:
      method: standardize
      mode: global
      eps_std: 1.0e-06
model:
  input_mu: ./examples/NARR_PRISM/scalars_with_H/inputs_mean.npy
  input_sigma: ./examples/NARR_PRISM/scalars_with_H/inputs_std.npy
  target_mu: ./examples/NARR_PRISM/scalars_with_H/targets_mean.npy
  target_sigma: ./examples/NARR_PRISM/scalars_with_H/targets_std.npy
  embed_dim: 1024
  n_blocks_encoder: 8
  mlp_multiplier: 4
  n_heads: 16
  dropout_rate: 0.0
  drop_path: 0.0
  residual: none
  num_static_channels: 0
  downscaling_patch_size:
  - 2
  - 2
  downscaling_embed_dim: 512
  encoder_decoder_type: conv
  encoder_decoder_upsampling_mode: pixel_shuffle
  encoder_decoder_kernel_size_per_stage:
  - - 3
  - - 3
  encoder_decoder_scale_per_stage:
  - - 2
  - - 3
  encoder_decoder_conv_channels: 128
  residual_connection: true
  encoder_shift: false
  unet: true
  decoder_upsampling_mode: bilinear
  output_scaler_resize_mode: bilinear
  output_scaler_align_corners: false
  unet_upsample_scales:
  - 2
  - 2
  - 2
  unet_decoder_kernel_size:
  - 3
  - 3
  - 3
job_id: NARR_PRISM
case_name: narr_prism_tiled_256_eff64
type_training: full_dataset
batch_size: 1
num_epochs: 20
dl_num_workers: 2
dl_prefetch_size: 1
learning_rate: 1.0e-05
max_grad_norm: 1.0
limit_steps_train: 100000
limit_steps_valid: 100
min_lr: 1.0e-06
max_lr: 0.0001
warm_up_steps: 0
mask_unit_size:
- 16
- 16
mask_ratio_inputs: 0.0
mask_ratio_targets: 0.0
max_batch_size: 4
path_experiment: ./examples/NARR_PRISM/experiments
checkpoint_dir: ./examples/NARR_PRISM/experiments/checkpoints
run_dir: ./examples/NARR_PRISM/experiments/runs
path_model_weights: ./granite-geospatial-wxc-downscaling/ECCC/weights/best_rmse_UNET.pt
backbone_use: true
backbone_freeze: false
backbone_prefix: encoder.
finetune_w_static: false
strict_matching: false
device_target: cuda
distributed_strategy: fsdp
fsdp_precision: bf16
fsdp_min_num_params: 5000000
backbone_gradient_checkpointing: true
skip_activation_offload: true
training:
  distributed: fsdp
  num_gpus: 2
  per_device_batch_size: 1
  gradient_accumulation_steps: 32
  auto_resume_if_checkpoint_exists: false
gradient_accumulation_steps: 32
loss:
  base: rmse
  predictands:
    ppt:
      distribution_loss:
        enabled: true
        method: cdf
        weight: 0.05
        use_mean: true
        use_std: true
        use_skewness: true
        bins: 100
    tmax:
      distribution_loss:
        enabled: true
        method: cdf
        weight: 0.05
        use_mean: true
        use_std: true
        use_skewness: false
        bins: 100
    tmin:
      distribution_loss:
        enabled: true
        method: cdf
        weight: 0.05
        use_mean: true
        use_std: true
        use_skewness: false
        bins: 100
  spatial_gradient:
    enabled: true
    weight: 0.03
    predictands:
      tmax: 1.0
      tmin: 1.0
      ppt: 0.25
    precipitation_wet_only: true
    precipitation_wet_threshold: 0.1
  use_gradient_loss: true
  gradient_loss_weight: 0.03
  use_tv_loss: false
  tv_loss_weight: 0.0005
  use_multiscale_loss: true
  multiscale_loss_weight: 0.015
  tv:
    enabled: false
    weight: 0.0005
    predictands:
      ppt: 0.1
      tmax: 0.3
      tmin: 0.3
  multiscale:
    enabled: true
    weight: 0.015
    scales:
    - 2
    - 4
    loss_type: l1
  boundary_continuity:
    enabled: true
    weight: 0.01
    predictands:
      ppt: 0.2
      tmax: 1.0
      tmin: 1.0
    stride_lat: 16
    stride_lon: 16
    match_target: true
inference:
  checkpoint_path: null
  output_dir: ./examples/NARR_PRISM/experiments/inference_output
  mixed_precision: true
  mixed_precision_dtype: bfloat16
  boundary_mitigation:
    enabled: true
    tile_size:
    - 96
    - 96
    overlap:
    - 32
    - 32
    blend_mode: hann
    deblock:
      enabled: false
      boundary_width: 2
      strength: 0.1
      kernel_size: 3
    force_full_frame: false
    blend_window: hann
    blend_sigma: 0.35
    use_seam_deblocking: false
    seam_deblocking_strength: 0.1
  inference_tile_size:
  - 256
  - 256
  inference_overlap:
  - 128
  - 128
  inference_blend_window: hann
  inference_blend_sigma: 0.35
  force_full_frame: false
  use_seam_deblocking: false
  seam_deblocking_strength: 0.1
precip_model: hurdle
precip_wet_threshold: 0.01
precip_occurrence_prob_threshold: 0.5
precip_lambda_occurrence: 1.0
precip_lambda_amount: 1.0
precip_amount_loss_type: smoothl1
resume_training: false
resume_checkpoint_path: null
auto_resume_if_checkpoint_exists: true
