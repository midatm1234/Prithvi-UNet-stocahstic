  input_vars:
  - shum_500
  - shum_700
  - shum_850
  - uwnd_500
  - uwnd_700
  - uwnd_850
  - vwnd_500
  - vwnd_700
  - vwnd_850
  - air_500
  - air_700
  - air_850
