  - mask_uwnd_850
  - mask_vwnd_500
  - mask_vwnd_700
  - mask_vwnd_850
  - mask_air_500
  - mask_air_700
  - mask_air_850
  - mask_hgt_500
  - mask_hgt_700
  - mask_hgt_850
  - mask_elev
  input_levels:
  - 1
  input_surface_vars: []
  vertical_pres_vars:
  - shum_500
  - shum_700
  - shum_850
  - uwnd_500
  - uwnd_700
  - uwnd_850
  - vwnd_500
  - vwnd_700
  - vwnd_850
  - air_500
  - air_700
  - air_850
  - hgt_500
  - hgt_700
  - hgt_850
  - elev
  - mask_shum_500
  - mask_shum_700
  - mask_shum_850
