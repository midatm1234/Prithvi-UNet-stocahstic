  skip_empty_target_tiles: true
  n_input_timestamps: 1
  regrid_method: linear
  scalar_stride: 1
  spatial_subset:
    enabled: true
    lat_min: 32.55
    lat_max: 41.075
    lon_min: -124.45
    lon_max: -115.925
dates:
  training:
    start: '1996-01-01'
    end: '2013-12-31'
  validation:
    start: '2014-01-01'
    end: '2015-12-31'
  inference:
    start: '2016-01-01'
    end: '2025-12-31'
normalization:
  predictor_method: standardize
  predictor_mode: global
  target_method: per_variable
predictands:
  ppt:
    name: ppt
    allow_negative_value: false
    nonnegativity:
      enabled: true
      method: softplus
    scaling:
      method: divide_only
      scale_stat: p95
      fixed_scale: null
    normalization:
      method: divide_only
      mode: global
      eps_std: 1.0e-06
      allow_negative_value: false
  tmax:
    name: tmax
    allow_negative_value: false
    nonnegativity:
      enabled: false
      method: none
    scaling:
      method: zscore
      scale_stat: mean
      fixed_scale: null
    normalization:
      method: standardize
      mode: gridpoint
      eps_std: 1.0e-06
  tmin:
    name: tmin
    allow_negative_value: false
    nonnegativity:
      enabled: false
      method: none
    scaling:
      method: zscore
      scale_stat: mean
      fixed_scale: null
    normalization:
      method: standardize
      mode: gridpoint
      eps_std: 1.0e-06
model:
  input_mu: ./examples/NARR_PRISM/scalars_with_H/inputs_mean.npy
  input_sigma: ./examples/NARR_PRISM/scalars_with_H/inputs_std.npy
  target_mu: ./examples/NARR_PRISM/scalars_with_H/targets_mean.npy
  target_sigma: ./examples/NARR_PRISM/scalars_with_H/targets_std.npy
  embed_dim: 1024
  n_blocks_encoder: 8
  mlp_multiplier: 4
  n_heads: 16
  dropout_rate: 0.0
  drop_path: 0.0
  residual: none
  num_static_channels: 0
  downscaling_patch_size:
  - 2
  - 2
  downscaling_embed_dim: 512
  encoder_decoder_type: conv
  encoder_decoder_upsampling_mode: bilinear
  encoder_decoder_kernel_size_per_stage:
  - - 3
  - - 3
  encoder_decoder_scale_per_stage:
  - - 2
  - - 3
  encoder_decoder_conv_channels: 128
  residual_connection: true
  backbone_residual_mode: pre_conv_add
  encoder_shift: false
  unet: true
  decoder_skip_source: dynamic
  backbone_attention_scope: windowed_local
  decoder_upsampling_mode: bilinear
  output_scaler_resize_mode: bilinear
  output_scaler_align_corners: false
  unet_upsample_scales:
  - 2
  - 2
  - 2
  unet_decoder_kernel_size:
  - 3
  - 3
  - 3
  phase1:
    checkpoint: ./examples/NARR_PRISM/experiments/checkpoints/narr_prism_California/last.ckpt
    freeze: true
    return_prithvi_features: false
    return_unet_features: false
  refinement:
    enabled: true
    type: diffusion_transformer
    checkpoint: null
    freeze_phase1: true
    joint_finetuning: false
    train_on_residual: true
    conditioning:
      deterministic_output: true
      input_predictors: true
      prithvi_features: false
      unet_features: false
      static_fields: true
      masks: true
    ensemble_size: 10
    loss: mse
    seed: 1234
    diffusion:
      training_timesteps: 1000
      inference_steps: 50
      prediction_type: epsilon
      schedule: cosine
      eta: 0.0
    transformer:
      patch_size: 8
      embedding_dim: 256
      num_heads: 8
      num_blocks: 6
      mlp_ratio: 4.0
      dropout: 0.0
      positional_encoding: learned_2d
      max_tokens_lat: 256
      max_tokens_lon: 256
      gradient_checkpointing: true
      optimized_attention: auto
job_id: NARR_PRISM_diffusion_transformer
case_name: narr_prism_California
type_training: full_dataset
batch_size: 1
num_epochs: 10
dl_num_workers: 2
dl_prefetch_size: 1
learning_rate: 0.0001
max_grad_norm: 1.0
limit_steps_train: 100000
limit_steps_valid: 100
min_lr: 1.0e-06
max_lr: 0.0001
warm_up_steps: 0
mask_unit_size:
- 16
- 16
mask_ratio_inputs: 0.0
mask_ratio_targets: 0.0
max_batch_size: 4
path_experiment: ./examples/NARR_PRISM/experiments
checkpoint_dir: ./examples/NARR_PRISM/experiments/refinement_checkpoints/diffusion_transformer
run_dir: ./examples/NARR_PRISM/experiments/runs
