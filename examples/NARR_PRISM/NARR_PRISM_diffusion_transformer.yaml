# Phase-2 residual refinement with a spatial-token Transformer DDPM/DDIM.
# Attention runs over 2-D spatial patches of one sample at one timestamp.
#
# Spatial downscaling / bias correction: predictors and targets share the
# same date. There is no forecast lead time anywhere in this file. The
# diffusion timestep and the flow interpolation time below are mathematical
# process variables, not physical timestamps.
#
# Generated from examples/NARR_PRISM/NARR_PRISM_subdomain.yaml; the source file is unchanged.

data:
  type: narr_prism
  predictor_dir: /data2/NARR/data/subset
  target_dir: /data/PRISM/prism_daily_800m_an
  target_variables:
  - ppt
  - tmax
  - tmin
  predictor_variables:
    shum:
    - 500
    - 700
    - 850
    uwnd:
    - 500
    - 700
    - 850
    vwnd:
    - 500
    - 700
    - 850
    air:
    - 500
    - 700
    - 850
    hgt:
    - 500
    - 700
    - 850
  static_elevation_file: ./examples/NARR_PRISM/prism_elevation.nc
