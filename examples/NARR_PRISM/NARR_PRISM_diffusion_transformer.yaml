  - mask_air_700
  - mask_air_850
  - mask_hgt_500
  - mask_hgt_700
  - mask_hgt_850
  - mask_elev
  input_level_pres:
  - 1
  vertical_level1_vars: []
  input_level1: []
  vertical_level2_vars: []
  input_level2: []
  other: []
  output_vars:
  - ppt
  - tmax
  - tmin
  use_static: true
  use_preprocessed: true
  preprocessed_dir: ./examples/NARR_PRISM/preprocessed
  scalar_dir: ./examples/NARR_PRISM/scalars_with_H
  scalers:
    inputs_mean: ./examples/NARR_PRISM/scalars_with_H/inputs_mean.npy
    inputs_std: ./examples/NARR_PRISM/scalars_with_H/inputs_std.npy
    targets_mean: ./examples/NARR_PRISM/scalars_with_H/targets_mean.npy
    targets_std: ./examples/NARR_PRISM/scalars_with_H/targets_std.npy
  train_crop_size_lat: 256
  train_crop_size_lon: 256
  training_spatial_sampling: tiled
  training_tile_stride_lat: 192
  training_tile_stride_lon: 192
  training_halo_lat: 32
  training_halo_lon: 32
  min_valid_target_fraction: 0.0001
