  embed_dim: 1024
  n_blocks_encoder: 8
  mlp_multiplier: 4
  n_heads: 16
  dropout_rate: 0.0
  drop_path: 0.0
  residual: none
  num_static_channels: 1
  downscaling_patch_size:
  - 2
  - 2
  downscaling_embed_dim: 512
  encoder_decoder_type: conv
  encoder_decoder_upsampling_mode: pixel_shuffle
  encoder_decoder_kernel_size_per_stage:
  - - 3
  - - 3
  encoder_decoder_scale_per_stage:
  - - 2
  - - 3
  encoder_decoder_conv_channels: 128
  residual_connection: true
  encoder_shift: false
  unet: true
  static_embedding_scale: 1.0
  static_skip_scale: 1
  static_dropout_p: 0
  decoder_upsampling_mode: bilinear
  output_scaler_resize_mode: bilinear
  output_scaler_align_corners: false
  unet_upsample_scales:
  - 2
  - 2
  - 2
  unet_decoder_kernel_size:
  - 3
  - 3
  - 3
  phase1:
    checkpoint: ./examples/CORDEX_ML/runs/SA_T2_ACCESS-CM2_static_train/SA_T2_ACCESS-CM2_static_twophase/checkpoints/phase1_unet/best.ckpt
    freeze: true
    return_prithvi_features: false
    return_unet_features: false
  refinement:
    enabled: true
    type: flow_matching_transformer
    checkpoint: null
    freeze_phase1: true
    joint_finetuning: false
    train_on_residual: true
    conditioning:
      deterministic_output: true
      input_predictors: true
      prithvi_features: false
      unet_features: false
      static_fields: true
      masks: true
    ensemble_size: 10
    loss: mse
    seed: 1234
    flow_matching:
      integration_steps: 50
      solver: heun
      source_distribution: gaussian
      stochastic_initialization: true
      time_sampling: logit_normal
    transformer:
      patch_size: 8
      embedding_dim: 256
      num_heads: 8
      num_blocks: 6
      mlp_ratio: 4.0
      dropout: 0.0
      positional_encoding: learned_2d
      max_tokens_lat: 128
      max_tokens_lon: 128
      gradient_checkpointing: true
      optimized_attention: auto
job_id: SA_T2_ACCESS-CM2_static_flow_matching_transformer
