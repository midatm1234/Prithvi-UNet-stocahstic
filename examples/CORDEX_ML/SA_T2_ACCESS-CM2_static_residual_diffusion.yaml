case_name: SA_T2_ACCESS-CM2_static_residual_diffusion
# Train on the complete configured period. The sampled inference workflow performs
# the decoded ensemble-mean comparison after training, so no validation loader or
# per-epoch diffusion sampling is run here.
validation_enabled: false
# With validation disabled, training writes last.ckpt but intentionally does not
# select best.ckpt. The sampled inference workflow validates last.ckpt.
save_epoch_checkpoints: false
data:
  type: cordex
  training_predictor_paths:
  - D:/CORDEX/SA_domain/train/Emulator_hist_future/predictors/ACCESS-CM2_1961-1980_2080-2099_regridded.nc
  training_target_paths:
  - D:/CORDEX/SA_domain/train/Emulator_hist_future/target/pr_tasmax_ACCESS-CM2_1961-1980_2080-2099.nc
  validation_predictor_paths: []
  validation_target_paths: []
  validation_holdout_fraction: 0.0
  validation_holdout_strategy: contiguous_tail
  test_predictor_paths: []
  test_target_paths: []
  static_path: D:/CORDEX/SA_domain/train/Emulator_hist_future/predictors/Static_fields.nc
  use_static: true
  input_vars:
  - u
  - v
  - q
  - t
  - z
  input_levels:
  - 850.0
  - 700.0
  - 500.0
  input_surface_vars: []
  input_static_surface_vars:
  - orog
  vertical_pres_vars:
  - u
  - v
  - q
  - t
  - z
  vertical_level1_vars: []
  vertical_level2_vars: []
  other: []
  output_vars:
  - pr
  - tasmax
  input_level_pres:
  - 850.0
  - 700.0
  - 500.0
  input_level1: []
  input_level2: []
  n_input_timestamps: 1
  n_random_windows: 1
  input_size_lat: 16
  input_size_lon: 16
  target_size_lat: 128
  target_size_lon: 128
  train_crop_size_lat: 128
  train_crop_size_lon: 128
  crop_factor: 128
  downsample_factor: 8
  scalers:
    inputs_mean: ./examples/CORDEX_ML/experiments/SA_T2_ACCESS-CM2_static_residual_diffusion/scalars/inputs_mean.npy
    inputs_std: ./examples/CORDEX_ML/experiments/SA_T2_ACCESS-CM2_static_residual_diffusion/scalars/inputs_std.npy
    targets_mean: ./examples/CORDEX_ML/experiments/SA_T2_ACCESS-CM2_static_residual_diffusion/scalars/targets_mean.npy
    targets_std: ./examples/CORDEX_ML/experiments/SA_T2_ACCESS-CM2_static_residual_diffusion/scalars/targets_std.npy
  train_random_crop_offset:
  - 8
  - 8
predictands:
  pr:
    name: pr
    allow_negative_value: false
    nonnegativity:
      enabled: true
      method: softplus
    scaling:
      method: divide_only
      scale_stat: p95
      fixed_scale: null
    normalization:
      method: divide_only
      mode: global
      eps_std: 1.0e-06
      allow_negative_value: false
  tasmax:
    name: tasmax
    allow_negative_value: false
    nonnegativity:
      enabled: false
      method: none
    scaling:
      method: standardize
      scale_stat: mean
      fixed_scale: null
    normalization:
      method: zscore
      mode: gridpoint
      eps_std: 1.0e-06
model:
  input_mu: ./examples/CORDEX_ML/experiments/SA_T2_ACCESS-CM2_static_residual_diffusion/scalars/inputs_mean.npy
  input_sigma: ./examples/CORDEX_ML/experiments/SA_T2_ACCESS-CM2_static_residual_diffusion/scalars/inputs_std.npy
  target_mu: ./examples/CORDEX_ML/experiments/SA_T2_ACCESS-CM2_static_residual_diffusion/scalars/targets_mean.npy
  target_sigma: ./examples/CORDEX_ML/experiments/SA_T2_ACCESS-CM2_static_residual_diffusion/scalars/targets_std.npy
  embed_dim: 1024
  n_blocks_encoder: 8
  mlp_multiplier: 4
  n_heads: 16
  dropout_rate: 0.0
  drop_path: 0.0
  residual: none
  num_static_channels: 1
  downscaling_patch_size:
  - 2
  - 2
  downscaling_embed_dim: 512
  encoder_decoder_type: conv
  encoder_decoder_upsampling_mode: pixel_shuffle
  encoder_decoder_kernel_size_per_stage:
  - - 3
  - - 3
  encoder_decoder_scale_per_stage:
  - - 2
  - - 3
  encoder_decoder_conv_channels: 128
  residual_connection: true
  encoder_shift: false
  unet: true
  static_embedding_scale: 1.0
  static_skip_scale: 1
  static_dropout_p: 0
  decoder_upsampling_mode: bilinear
  output_scaler_resize_mode: bilinear
  output_scaler_align_corners: false
  unet_upsample_scales: [2, 2, 2]
  unet_decoder_kernel_size: [3, 3, 3]
  # ------------------------------------------------------------------
  # Joint deterministic U-Net plus residual score model (adapted from mlde).
  # In residual mode the normal U-Net head remains present and is updated by
  # the v6 supervised loss; the diffusion branch learns its signed correction.
  # Set head_type to deterministic to disable the score branch entirely.
  # ------------------------------------------------------------------
  head_type: diffusion
  # Inactive alternative precipitation-head settings. Corrected-field training
  # uses precip_model=single_head below so the pretrained U-Net precipitation
  # and corrected precipitation are both scored by the same field loss.
  bernoulli_gamma:
    wet_threshold: 0.01         # physical mm/day; same wet/dry cutoff as v6
    lambda_occurrence: 1.0
    lambda_positive_amount: 1.0
    min_mu: 1.0e-4              # physical mm/day stability floor
    min_phi: 1.0e-4             # dispersion stability floor
    occurrence_prob_threshold: 0.5
    spatial_diffusion_steps: 0  # keep disabled; no sample smoothing
    spatial_diffusion_sigma: 1.0
  diffusion:
    # --- SDE / forward process ---
    # DDIM's stochastic eta equations require the variance-preserving process.
    sde: vpsde                 # one of: vpsde, subvpsde, vesde
    beta_min: 0.1              # VP / subVP beta schedule
    beta_max: 5.0
    sigma_min: 0.01            # VE sigma schedule (unused for VP/subVP)
    sigma_max: 50.0
    num_scales: 1000           # discretization scales (a.k.a. num_diffusion_steps)
    continuous: true
    likelihood_weighting: false
    reduce_mean: true
    eps: 1.0e-5                 # minimum training diffusion time
    # Feed continuous SDE time t in [0, 1] directly to the Fourier embedding.
    noise_conditioning_scale: 1.0
    # --- reverse process / sampling ---
    # ddim with eta=0 is deterministic (no stochastic noise injected); increase
    # eta toward 1.0 to add controlled spread across ensemble members.
    sampling_method: ddim       # 'pc' (predictor-corrector), 'ode', or 'ddim'
    eta: 0.0                    # reproducible qualification; spread comes from x_T
    predictor: euler_maruyama   # only used when sampling_method=pc
    corrector: none             # only used when sampling_method=pc
    snr: 0.16
    n_corrector_steps: 1
    num_sampling_steps: 256     # more steps improve sample quality (was 128)
    probability_flow: false
    denoise: true
    sampling_eps: 1.0e-3        # final reverse-process time before x0
    # --- score network ---
    base_channels: 64
    channel_multipliers: [1, 2, 2]
    num_res_blocks: 2           # increased from 1 for more network capacity
    time_embed_dim: 128
    dropout: 0.1                # regularisation (was 0.0)
    # Lower Fourier frequency preserves smooth interpolation across continuous
    # SDE time; scale 16 failed the held-out-seed tiny overfit gate.
    fourier_scale: 16.0
    # projects high-dim conditioning to this channel count before concatenation
    # (reduces the 640→128 channel ratio so conditioning info is not lost)
    projected_cond_channels: 128
    # residual_diffusion: trains the head on (target - deterministic_baseline)
    # which is a much easier learning task than generating the full target.
    # Uses the jointly supervised deterministic UNet output as the baseline.
    residual_diffusion: true   # set true to enable residual mode
    # Directly supervised conditional residual mean. The score model learns the
    # remaining innovation; both are recombined only at sampling.
    residual_mean_enabled: true
    residual_mean_channels: 64
    prediction_type: epsilon
    # Deployment remains fail-closed until held-out validation proves that the
    # ensemble-mean correction improves the deterministic baseline.  Set this
    # above zero only in an explicitly versioned/calibrated experiment.
    residual_application_scale: 1.0
    # Zero padding was the source of the rectangular full-frame edge response.
    # Replication is used consistently during retraining and inference.
    padding_mode: replicate
    zero_init_output: true
    # The clean-residual term fixes epsilon MSE's weak x0 pressure at the
    # beta_max=20 terminal-noise end. The inverse-SNR cap bounds loss gradients
    # only; generated corrections are never clipped, damped, or rescaled.
    clean_x0_reconstruction_weight: 0.0
    clean_x0_inverse_snr_cap: 100.0
    # Online residual moments are accumulated during training.  At inference they
    # gate corrections that exceed 5× the observed training-RMS per channel.
    # 'clip' rescales the spatial pattern to the limit rather than raising.
    # Set residual_magnitude_guard_multiple: 0.0 to disable the guard entirely.
    residual_magnitude_guard_multiple: 5.0
    residual_guard_min_count: 1024
    residual_guard_mode: clip
    # --- documentation only (channels are inferred from the model) ---
    conditioning_channels: null
    output_channels: 2
job_id: SA_T2_ACCESS-CM2_static_residual_diffusion
type_training: full_dataset
batch_size: 64
num_epochs: 25
dl_num_workers: 2
dl_prefetch_size: 1
learning_rate: 5.0e-05
limit_steps_train: 100000
limit_steps_valid: 100
min_lr: 1.0e-06
max_lr: 0.0001
warm_up_steps: 0
mask_unit_size:
- 16
- 16
mask_ratio_inputs: 0.0
mask_ratio_targets: 0.0
max_batch_size: 4
path_experiment: ./examples/CORDEX_ML/experiments
# Fresh training run: initialize compatible backbone/U-Net tensors from the
# pretrained best U-Net weights. Optimizer, scheduler, and epoch state start new.
path_model_weights: ./granite-geospatial-wxc-downscaling/ECCC/weights/best_rmse_UNET.pt
backbone_use: true
backbone_freeze: false
backbone_prefix: encoder.
finetune_w_static: true
strict_matching: false
device_target: cuda
distributed_strategy: fsdp
fsdp_precision: bf16
fsdp_min_num_params: 5000000
backbone_gradient_checkpointing: true
skip_activation_offload: true
inference:
  ensemble_size: 5
  base_seed: 42
  boundary_mitigation:
    # Diffusion must evolve one global latent. Independent tile samplers draw
    # unrelated noise and are therefore rejected by the inference utility.
    enabled: false
    tile_size: [96, 96]
    overlap: [32, 32]
    blend_mode: hann
    deblock:
      enabled: false
      boundary_width: 2
      strength: 0.1
      kernel_size: 3
    halo: [32, 32]             # deterministic-only halo tiling (unused here)
    tile_origin: [0, 0]
    force_full_frame: true
    blend_window: hann
    blend_sigma: 0.35
    use_seam_deblocking: false
    seam_deblocking_strength: 0.1
  inference_tile_size: [96, 96]
  inference_overlap: [32, 32]
  inference_blend_window: hann
  inference_blend_sigma: 0.35
  inference_halo: [32, 32]
  inference_tile_origin: [0, 0]
  force_full_frame: true
  use_seam_deblocking: false
  seam_deblocking_strength: 0.1
validation:
  residual_correction:
    # Disabled with validation_enabled above. These retained settings document
    # the intended post-training sampled-inference comparison only.
    enabled: false
    ensemble_size: 3
    base_seed: 42
    # Qualification always evaluates the full learned correction even though
    # ordinary inference remains fail-closed at residual_application_scale=0.
    application_scale: 1.0
    # Fixed paired subset per epoch; increase for the final deployment
    # certificate after training.
    limit_steps: 2
    require_each_configured_term_non_degradation: true
    term_tolerance: 0.0
training:
  distributed: fsdp
  num_gpus: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 32
  auto_resume_if_checkpoint_exists: false
  # Joint training: the pretrained U-Net is only an initializer. Its backbone
  # and deterministic output head are updated by the complete YAML-configured
  # baseline loss, while the residual-mean and score networks are also updated.
  freeze_deterministic_baseline: true
gradient_accumulation_steps: 32
# Fresh optimizer/scheduler run; path_model_weights above is only an initializer.
resume_training: false
resume_checkpoint_path: null
# Use the pretrained deterministic U-Net output directly. Probabilistic
# precipitation auxiliaries describe only their own baseline head and cannot
# honestly score an arbitrary corrected ensemble-mean field.
precip_model: single_head
loss:
  base: rmse
  deterministic_weight: 1.0
  diffusion:
    weight: 1.0
    # These weights and the required improvement are read from this YAML by the
    # joint loss. The same complete configured predictand loss below is called
    # for the U-Net baseline and corrected mean; no metric is chosen in code.
    corrected_mean_weight: 1.0
    improvement_penalty_weight: 1.0
    minimum_relative_improvement: 0.02
  predictands:
    pr:
      distribution_loss:
        enabled: false
        weight: 0.0
        method: cdf
        bins: 100
    tasmax:
      distribution_loss:
        enabled: true
        method: cdf
        weight: 0.05
        use_mean: true
        use_std: true
        use_skewness: false
        bins: 100
  spatial_gradient:
    enabled: true
    weight: 0.03
    predictands:
      tasmax: 1.0
      pr: 0.25
    precipitation_wet_only: true
    precipitation_wet_threshold: 0.1
  use_gradient_loss: true
  gradient_loss_weight: 0.03
  use_tv_loss: false
  tv_loss_weight: 0.0005
  use_multiscale_loss: true
  multiscale_loss_weight: 0.015
  tv:
    enabled: false
    weight: 0.0005
    predictands:
      pr: 0.1
      tasmax: 0.3
  multiscale:
    enabled: true
    weight: 0.015
    scales: [2, 4]
    loss_type: l1
  boundary_continuity:
    enabled: true
    weight: 0.01
    predictands:
      pr: 0.2
      tasmax: 1.0
    stride_lat: 16
    stride_lon: 16
    match_target: true
auto_resume_if_checkpoint_exists: false
