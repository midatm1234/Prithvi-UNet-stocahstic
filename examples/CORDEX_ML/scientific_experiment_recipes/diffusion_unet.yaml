schema: registered_scientific_experiment_recipe_catalog_v1
head: diffusion_unet
case_configuration: examples/CORDEX_ML/SA_T2_ACCESS-CM2_static_diffusion_unet.yaml
variables:
- pr
- tasmax
entrypoint: examples/CORDEX_ML/cordex_scientific_experiments.py train
selection: Select exactly one recipe by --recipe; no automatic Cartesian product.
fresh_training_required: true
refinement_configuration:
  enabled: true
  type: diffusion_unet
  checkpoint: null
  freeze_phase1: true
  joint_finetuning: false
  train_on_residual: true
  ensemble_size: 10
  loss: mse
  reconstruction_loss_weight: 0.25
  multiscale_loss_weight: 0.1
  gradient_loss_weight: 0.05
  mean_bias_loss_weight: 0.01
  nonnegative_ensemble_strategy: memberwise
  seed: 1234
  conditioning:
    deterministic_output: true
    input_predictors: true
    prithvi_features: false
    unet_features: false
    static_fields: true
    masks: true
    normalize_predictors: false
  residual_normalization:
    method: standardize
    epsilon: 1.0e-06
    minimum_scale: 0.0001
    require_fitted: true
  diffusion:
    training_timesteps: 1000
    inference_steps: 50
    prediction_type: sample
    schedule: cosine
    beta_start: 0.0001
    beta_end: 0.02
    cosine_s: 0.008
    clip_sample: false
    clip_sample_range: 10.0
    eta: 0.0
  flow_matching:
    integration_steps: 50
    solver: euler
    source_distribution: gaussian
    stochastic_initialization: true
    sigma_min: 0.0001
    time_sampling: uniform
    logit_normal_mean: -0.5
    logit_normal_std: 1.2
    mean_path_loss_weight: 0.0
  transformer:
    patch_size:
    - 4
    - 4
    embedding_dim: 256
    num_heads: 8
    num_blocks: 6
    mlp_ratio: 4.0
    dropout: 0.0
    positional_encoding: learned_2d
    max_tokens_lat: 256
    max_tokens_lon: 256
    gradient_checkpointing: false
    optimized_attention: auto
    zero_init_output: true
    spatial_alignment: legacy
  unet:
    hidden_channels: 64
    num_levels: 3
    time_embedding_dim: 128
    dropout: 0.0
    bottleneck_attention: true
    attention_heads: 4
    zero_init_output: true
    spatial_alignment: legacy
