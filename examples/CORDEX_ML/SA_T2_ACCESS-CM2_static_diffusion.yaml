case_name: SA_T2_ACCESS-CM2_static_diffusion
data:
  type: cordex
  training_predictor_paths:
  - ./granite-geospatial-wxc-downscaling/CORDEX/SA_domain/train/Emulator_hist_future/predictors/ACCESS-CM2_1961-1980_2080-2099_regridded.nc
  training_target_paths:
  - ./granite-geospatial-wxc-downscaling/CORDEX/SA_domain/train/Emulator_hist_future/target/pr_tasmax_ACCESS-CM2_1961-1980_2080-2099.nc
  validation_predictor_paths:
  - ./granite-geospatial-wxc-downscaling/CORDEX/SA_domain/train/Emulator_hist_future/predictors/ACCESS-CM2_1961-1980_2080-2099_regridded.nc
  validation_target_paths:
  - ./granite-geospatial-wxc-downscaling/CORDEX/SA_domain/train/Emulator_hist_future/target/pr_tasmax_ACCESS-CM2_1961-1980_2080-2099.nc
  test_predictor_paths: []
  test_target_paths: []
  static_path: ./granite-geospatial-wxc-downscaling/CORDEX/SA_domain/train/Emulator_hist_future/predictors/Static_fields.nc
  use_static: true
  input_vars:
  - u
  - v
  - q
  - t
  - z
  input_levels:
  - 850.0
  - 700.0
  - 500.0
  input_surface_vars: []
  input_static_surface_vars:
  - orog
  vertical_pres_vars:
  - u
  - v
  - q
  - t
  - z
  vertical_level1_vars: []
  vertical_level2_vars: []
  other: []
  output_vars:
  - pr
  - tasmax
  input_level_pres:
  - 850.0
  - 700.0
  - 500.0
  input_level1: []
  input_level2: []
  n_input_timestamps: 1
  n_random_windows: 1
  input_size_lat: 16
  input_size_lon: 16
  target_size_lat: 256
  target_size_lon: 256
  crop_factor: 256
  downsample_factor: 8
  scalers:
    inputs_mean: ./examples/CORDEX_ML/runs/SA_T2_ACCESS-CM2_static_train/SA_T2_ACCESS-CM2_static_diffusion/scalars/inputs_mean.npy
    inputs_std: ./examples/CORDEX_ML/runs/SA_T2_ACCESS-CM2_static_train/SA_T2_ACCESS-CM2_static_diffusion/scalars/inputs_std.npy
    targets_mean: ./examples/CORDEX_ML/runs/SA_T2_ACCESS-CM2_static_train/SA_T2_ACCESS-CM2_static_diffusion/scalars/targets_mean.npy
    targets_std: ./examples/CORDEX_ML/runs/SA_T2_ACCESS-CM2_static_train/SA_T2_ACCESS-CM2_static_diffusion/scalars/targets_std.npy
predictands:
  pr:
    name: pr
    allow_negative_value: false
    nonnegativity:
      enabled: true
      method: softplus
    scaling:
      method: divide_only
      scale_stat: p95
      fixed_scale: null
    normalization:
      method: divide_only
      mode: global
      eps_std: 1.0e-06
      allow_negative_value: false
  tasmax:
    name: tasmax
    allow_negative_value: false
    nonnegativity:
      enabled: false
      method: none
    scaling:
      method: zscore
      scale_stat: mean
      fixed_scale: null
    normalization:
      method: zscore
      mode: gridpoint
      eps_std: 1.0e-06
model:
  input_mu: ./examples/CORDEX_ML/runs/SA_T2_ACCESS-CM2_static_train/SA_T2_ACCESS-CM2_static_diffusion/scalars/inputs_mean.npy
  input_sigma: ./examples/CORDEX_ML/runs/SA_T2_ACCESS-CM2_static_train/SA_T2_ACCESS-CM2_static_diffusion/scalars/inputs_std.npy
  target_mu: ./examples/CORDEX_ML/runs/SA_T2_ACCESS-CM2_static_train/SA_T2_ACCESS-CM2_static_diffusion/scalars/targets_mean.npy
  target_sigma: ./examples/CORDEX_ML/runs/SA_T2_ACCESS-CM2_static_train/SA_T2_ACCESS-CM2_static_diffusion/scalars/targets_std.npy
  embed_dim: 1024
  n_blocks_encoder: 8
  mlp_multiplier: 4
  n_heads: 16
  dropout_rate: 0.0
  drop_path: 0.0
  residual: none
  num_static_channels: 1
  downscaling_patch_size:
  - 2
  - 2
  downscaling_embed_dim: 512
  encoder_decoder_type: conv
  encoder_decoder_upsampling_mode: pixel_shuffle
  encoder_decoder_kernel_size_per_stage:
  - - 3
  - - 3
  encoder_decoder_scale_per_stage:
  - - 2
  - - 3
  encoder_decoder_conv_channels: 128
  residual_connection: true
  encoder_shift: false
  unet: true
  # ------------------------------------------------------------------
  # Diffusion decoder head (score-based SDE, adapted from mlde).
  # Set head_type to 'diffusion' to replace the deterministic conv head
  # with the conditional diffusion head. Remove head_type (or set it to
  # 'deterministic') to fall back to the default conv/UNet head.
  # ------------------------------------------------------------------
  head_type: diffusion
  diffusion:
    # --- SDE / forward process ---
    sde: subvpsde              # one of: vpsde, subvpsde, vesde
    beta_min: 0.1              # VP / subVP beta schedule
    beta_max: 20.0
    sigma_min: 0.01            # VE sigma schedule (unused for VP/subVP)
    sigma_max: 50.0
    num_scales: 1000           # discretization scales (a.k.a. num_diffusion_steps)
    continuous: true
    likelihood_weighting: false
    reduce_mean: true
    # --- reverse process / sampling ---
    # ddim with eta=0 is deterministic (no stochastic noise injected); increase
    # eta toward 1.0 to add controlled spread across ensemble members.
    sampling_method: ddim       # 'pc' (predictor-corrector), 'ode', or 'ddim'
    eta: 0.2                    # DDIM stochasticity (0=deterministic, 1=DDPM)
    predictor: euler_maruyama   # only used when sampling_method=pc
    corrector: none             # only used when sampling_method=pc
    snr: 0.16
    n_corrector_steps: 1
    num_sampling_steps: 256     # more steps improve sample quality (was 128)
    probability_flow: false
    denoise: true
    # --- score network ---
    base_channels: 64
    channel_multipliers: [1, 2, 2]
    num_res_blocks: 2           # increased from 1 for more network capacity
    time_embed_dim: 128
    dropout: 0.1                # regularisation (was 0.0)
    fourier_scale: 16.0
    # projects high-dim conditioning to this channel count before concatenation
    # (reduces the 640→128 channel ratio so conditioning info is not lost)
    projected_cond_channels: 128
    # residual_diffusion: trains the head on (target - deterministic_baseline)
    # which is a much easier learning task than generating the full target.
    # Requires a separate baseline_head (2-conv lightweight decoder).
    residual_diffusion: false   # set true to enable residual mode
    # --- documentation only (channels are inferred from the model) ---
    conditioning_channels: null
    output_channels: 2
job_id: SA_T2_ACCESS-CM2_static_diffusion
type_training: full_dataset
batch_size: 16
num_epochs: 10
dl_num_workers: 2
dl_prefetch_size: 1
learning_rate: 5.0e-05
limit_steps_train: 100000
limit_steps_valid: 100
min_lr: 1.0e-06
max_lr: 0.0001
warm_up_steps: 0
mask_unit_size:
- 16
- 16
mask_ratio_inputs: 0.0
mask_ratio_targets: 0.0
max_batch_size: 4
path_experiment: ./examples/CORDEX_ML/experiments
path_model_weights: ./granite-geospatial-wxc-downscaling/ECCC/weights/best_rmse_UNET.pt
backbone_use: true
backbone_freeze: false
backbone_prefix: encoder.
finetune_w_static: true
strict_matching: false
device_target: cpu
distributed_strategy: none
fsdp_precision: bf16
fsdp_min_num_params: 5000000
backbone_gradient_checkpointing: true
skip_activation_offload: true
inference:
  ensemble_size: 10
  base_seed: 42
training:
  distributed: none
  num_gpus: 0
  per_device_batch_size: 1
  gradient_accumulation_steps: 32
gradient_accumulation_steps: 32
resume_training: false
resume_checkpoint_path: null
# The diffusion head models pr/tasmax jointly; the hurdle precipitation model is
# not compatible with it, so use the single-head precipitation model here.
precip_model: single_head
precip_wet_threshold: 0.1  # mm/day (converted to normalised units at runtime using p95 scaler)
precip_lambda_occurrence: 1.0
precip_lambda_amount: 1.0
precip_amount_loss_type: smoothl1
loss:
  base: rmse
  predictands:
    pr:
      distribution_loss:
        enabled: false
        weight: 0.0
        method: cdf
        bins: 100
