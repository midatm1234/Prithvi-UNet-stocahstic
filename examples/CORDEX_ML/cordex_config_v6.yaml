data:
  type: cordex
  training_predictor_paths:
  - ./granite-geospatial-wxc-downscaling/CORDEX/NZ_domain/train/ESD_pseudo_reality/predictors/ACCESS-CM2_1961-1980_regridded.nc
  training_target_paths:
  - ./granite-geospatial-wxc-downscaling/CORDEX/NZ_domain/train/ESD_pseudo_reality/target/pr_tasmax_ACCESS-CM2_1961-1980.nc
  validation_predictor_paths:
  - ./granite-geospatial-wxc-downscaling/CORDEX/NZ_domain/train/ESD_pseudo_reality/predictors/ACCESS-CM2_1961-1980_regridded.nc
  validation_target_paths:
  - ./granite-geospatial-wxc-downscaling/CORDEX/NZ_domain/train/ESD_pseudo_reality/target/pr_tasmax_ACCESS-CM2_1961-1980.nc
  test_predictor_paths:
  - ./granite-geospatial-wxc-downscaling/CORDEX/NZ_domain/train/ESD_pseudo_reality/predictors/ACCESS-CM2_1961-1980_regridded.nc
  test_target_paths:
  - ./granite-geospatial-wxc-downscaling/CORDEX/NZ_domain/train/ESD_pseudo_reality/target/pr_tasmax_ACCESS-CM2_1961-1980.nc
  static_path: ./granite-geospatial-wxc-downscaling/CORDEX/NZ_domain/train/ESD_pseudo_reality/predictors/Static_fields.nc
  input_vars:
  - u
  - v
  - q
  - t
  - z
  input_levels:
  - 850.0
  - 700.0
  - 500.0
  input_surface_vars: []
  input_static_surface_vars: []
  vertical_pres_vars:
  - u
  - v
  - q
  - t
  - z
  vertical_level1_vars: []
  vertical_level2_vars: []
  other: []
  output_vars:
  - pr
  - tasmax
  input_level_pres:
  - 850.0
  - 700.0
  - 500.0
  input_level1: []
  input_level2: []
  n_input_timestamps: 1
  n_random_windows: 1
  input_size_lat: 16
  input_size_lon: 16
  target_size_lat: 128
  target_size_lon: 128
  crop_factor: 128
  downsample_factor: 8
  scalers:
    inputs_mean: /mnt/data2/kyo/granite-wxc/examples/CORDEX_ML/experiments/NZ_v6_scalars/inputs_mean.npy
    inputs_std: /mnt/data2/kyo/granite-wxc/examples/CORDEX_ML/experiments/NZ_v6_scalars/inputs_std.npy
    targets_mean: /mnt/data2/kyo/granite-wxc/examples/CORDEX_ML/experiments/NZ_v6_scalars/targets_mean.npy
    targets_std: /mnt/data2/kyo/granite-wxc/examples/CORDEX_ML/experiments/NZ_v6_scalars/targets_std.npy
predictands:
  pr:
    name: pr
    allow_negative_value: false
    nonnegativity:
      enabled: true
      method: softplus
    scaling:
      method: divide_only
      scale_stat: p95
      fixed_scale: null
    normalization:
      method: divide_only
      mode: global
      eps_std: 1.0e-06
      allow_negative_value: false
  tasmax:
    name: tasmax
    allow_negative_value: false
    nonnegativity:
      enabled: false
      method: none
    scaling:
      method: zscore
      scale_stat: mean
      fixed_scale: null
    normalization:
      method: standardize
      mode: gridpoint
      eps_std: 1.0e-06
model:
  input_mu: /mnt/data2/kyo/granite-wxc/examples/CORDEX_ML/experiments/NZ_v6_scalars/inputs_mean.npy
  input_sigma: /mnt/data2/kyo/granite-wxc/examples/CORDEX_ML/experiments/NZ_v6_scalars/inputs_std.npy
  target_mu: /mnt/data2/kyo/granite-wxc/examples/CORDEX_ML/experiments/NZ_v6_scalars/targets_mean.npy
  target_sigma: /mnt/data2/kyo/granite-wxc/examples/CORDEX_ML/experiments/NZ_v6_scalars/targets_std.npy
  embed_dim: 2560
  n_blocks_encoder: 12
  mlp_multiplier: 4
  n_heads: 16
  dropout_rate: 0.0
  drop_path: 0.05
  residual: none
  num_static_channels: 1
  downscaling_patch_size:
  - 2
  - 2
  downscaling_embed_dim: 256
  encoder_decoder_type: conv
  encoder_decoder_upsampling_mode: pixel_shuffle
  encoder_decoder_kernel_size_per_stage:
  - - 3
  - - 3
  encoder_decoder_scale_per_stage:
  - - 2
  - - 3
  encoder_decoder_conv_channels: 128
  residual_connection: true
  encoder_shift: false
  unet: true
job_id: cordex_nz_v6
type_training: full_dataset
batch_size: 64
num_epochs: 10
dl_num_workers: 2
dl_prefetch_size: 1
learning_rate: 5.0e-05
limit_steps_train: 100000
limit_steps_valid: 100
min_lr: 1.0e-06
max_lr: 0.0001
warm_up_steps: 0
mask_unit_size:
- 16
- 16
mask_ratio_inputs: 0.0
mask_ratio_targets: 0.0
max_batch_size: 4
path_experiment: ./examples/CORDEX_ML/experiments
path_model_weights: /mnt/data2/kyo/granite-wxc/granite-geospatial-wxc-downscaling/pytorch_model.bin
backbone_use: true
backbone_freeze: false
backbone_prefix: encoder.
finetune_w_static: true
strict_matching: false
inference:
  boundary_mitigation:
    enabled: true
    tile_size:
    - 128
    - 128
    overlap:
    - 32
    - 32
    blend_mode: cosine
    deblock:
      enabled: false
      boundary_width: 2
      strength: 0.15
      kernel_size: 3
training:
  distributed: fsdp
  num_gpus: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 32
gradient_accumulation_steps: 32
loss:
  base: rmse
  predictands:
    pr:
      distribution_loss:
        enabled: false
        method: cdf
        weight: 0.0
        bins: 100
    tasmax:
      distribution_loss:
        enabled: true
        method: cdf
        weight: 0.05
        use_mean: true
        use_std: true
        use_skewness: false
        bins: 100
resume_training: false
resume_checkpoint_path: null
precip_model: hurdle
precip_wet_threshold: 0.01
precip_lambda_occurrence: 1.0
precip_lambda_amount: 1.0
precip_amount_loss_type: smoothl1
