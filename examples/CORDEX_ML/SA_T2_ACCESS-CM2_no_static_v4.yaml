data:
  type: cordex
  training_predictor_paths:
  - ./granite-geospatial-wxc-downscaling/CORDEX/SA_domain/train/Emulator_hist_future/predictors/ACCESS-CM2_1961-1980_2080-2099_regridded.nc
  training_target_paths:
  - ./granite-geospatial-wxc-downscaling/CORDEX/SA_domain/train/Emulator_hist_future/target/pr_tasmax_ACCESS-CM2_1961-1980_2080-2099.nc
  validation_predictor_paths:
  - ./granite-geospatial-wxc-downscaling/CORDEX/SA_domain/train/Emulator_hist_future/predictors/ACCESS-CM2_1961-1980_2080-2099_regridded.nc
  validation_target_paths:
  - ./granite-geospatial-wxc-downscaling/CORDEX/SA_domain/train/Emulator_hist_future/target/pr_tasmax_ACCESS-CM2_1961-1980_2080-2099.nc
  test_predictor_paths: []
  test_target_paths: []
  use_static: false
  input_vars:
  - u
  - v
  - q
  - t
  - z
  input_levels:
  - 850.0
  - 700.0
  - 500.0
  input_surface_vars: []
  vertical_pres_vars:
  - u
  - v
  - q
  - t
  - z
  vertical_level1_vars: []
  vertical_level2_vars: []
  other: []
  output_vars:
  - pr
  - tasmax
  input_level_pres:
  - 850.0
  - 700.0
  - 500.0
  input_level1: []
  input_level2: []
  n_input_timestamps: 1
  n_random_windows: 1
  input_size_lat: 16
  input_size_lon: 16
  target_size_lat: 256
  target_size_lon: 256
  crop_factor: 256
  downsample_factor: 8
  scalers:
    inputs_mean: ./examples/CORDEX_ML/experiments/SA_T2_ACCESS-CM2_no_static_v4_scalars/inputs_mean.npy
    inputs_std: ./examples/CORDEX_ML/experiments/SA_T2_ACCESS-CM2_no_static_v4_scalars/inputs_std.npy
    targets_mean: ./examples/CORDEX_ML/experiments/SA_T2_ACCESS-CM2_no_static_v4_scalars/targets_mean.npy
    targets_std: ./examples/CORDEX_ML/experiments/SA_T2_ACCESS-CM2_no_static_v4_scalars/targets_std.npy
predictands:
  pr:
    name: pr
    allow_negative_value: false
    nonnegativity:
      enabled: true
      method: softplus
    scaling:
      method: log1p_standardize
      scale_stat: mean
      fixed_scale: null
    normalization:
      method: log1p_standardize
      mode: gridpoint
      eps_std: 1.0e-06
      allow_negative_value: false
  tasmax:
    name: tasmax
    allow_negative_value: false
    nonnegativity:
      enabled: false
      method: none
    scaling:
      method: zscore
      scale_stat: mean
      fixed_scale: null
    normalization:
      method: standardize
      mode: gridpoint
      eps_std: 1.0e-06
model:
  input_mu: ./examples/CORDEX_ML/experiments/SA_T2_ACCESS-CM2_no_static_v4_scalars/inputs_mean.npy
  input_sigma: ./examples/CORDEX_ML/experiments/SA_T2_ACCESS-CM2_no_static_v4_scalars/inputs_std.npy
  target_mu: ./examples/CORDEX_ML/experiments/SA_T2_ACCESS-CM2_no_static_v4_scalars/targets_mean.npy
  target_sigma: ./examples/CORDEX_ML/experiments/SA_T2_ACCESS-CM2_no_static_v4_scalars/targets_std.npy
  embed_dim: 1024
  n_blocks_encoder: 8
  mlp_multiplier: 4
  n_heads: 16
  dropout_rate: 0.0
  drop_path: 0.0
  residual: none
  num_static_channels: 0
  downscaling_patch_size:
  - 2
  - 2
  downscaling_embed_dim: 512
  encoder_decoder_type: conv
  encoder_decoder_upsampling_mode: pixel_shuffle
  encoder_decoder_kernel_size_per_stage:
  - - 3
  - - 3
  encoder_decoder_scale_per_stage:
  - - 2
  - - 3
  encoder_decoder_conv_channels: 128
  residual_connection: true
  encoder_shift: false
  unet: true
job_id: SA_T2_ACCESS-CM2_no_static
type_training: full_dataset
batch_size: 16
num_epochs: 5
dl_num_workers: 2
dl_prefetch_size: 1
learning_rate: 5.0e-05
limit_steps_train: 100000
limit_steps_valid: 100
min_lr: 1.0e-06
max_lr: 0.0001
warm_up_steps: 0
mask_unit_size:
- 16
- 16
mask_ratio_inputs: 0.0
mask_ratio_targets: 0.0
max_batch_size: 4
path_experiment: ./examples/CORDEX_ML/experiments
path_model_weights: ./granite-geospatial-wxc-downscaling/ECCC/weights/best_rmse_UNET.pt
backbone_use: true
backbone_freeze: false
backbone_prefix: encoder.
finetune_w_static: false
strict_matching: false
device_target: cuda
distributed_strategy: fsdp
fsdp_precision: bf16
fsdp_min_num_params: 5000000
backbone_gradient_checkpointing: true
skip_activation_offload: true
inference:
  boundary_mitigation:
    enabled: true
    tile_size:
    - 256
    - 256
    overlap:
    - 64
    - 64
    blend_mode: cosine
    deblock:
      enabled: false
      boundary_width: 2
      strength: 0.15
      kernel_size: 3
training:
  distributed: ddp
  num_gpus: 2
  per_device_batch_size: 1
  gradient_accumulation_steps: 32
gradient_accumulation_steps: 32
loss:
  base: rmse
  predictands:
    pr:
      distribution_loss:
        enabled: false
    tasmax:
      distribution_loss:
        enabled: false
        method: moment
        weight: 0.05
        use_mean: true
        use_std: true
        use_skewness: false

resume_training: false
resume_checkpoint_path: null
