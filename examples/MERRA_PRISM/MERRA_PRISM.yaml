# ============================================================
# MERRA2-to-PRISM Downscaling Configuration
# ============================================================
# Edit this file to control the full workflow:
#   compute scalars → preprocessing → training → inference

# --- Data paths -----------------------------------------------------------
data:
  type: merra_prism

  # Daily MERRA2 predictor files (NetCDF4).
  predictor_dir: /data/merra2_daily_subset

  # Root of PRISM daily 800 m target data.
  # Each target variable lives in a subfolder: <target_dir>/<var>/<YYYY>/*.nc
  target_dir: /data/PRISM/prism_daily_800m_an

  # Three PRISM target variable sub-folders.
  target_variables:
    - ppt
    - tmax
    - tmin

  # MERRA2 predictor variable names expected inside each daily file.
  predictor_variables:
    - T2M
    - U10M
    - V10M
    - QV2M
    - PS
    - SLP
    - PRECTOT
    - PRECTOTCORR
    - T500
    - T850
    - U500
    - U850
    - V500
    - V850
    - H500
    - H850

  # Preprocessed / regridded output directory.
  preprocessed_dir: ./examples/MERRA_PRISM/preprocessed

  # Scalar / statistics directory.
  scalar_dir: ./examples/MERRA_PRISM/scalars

  # Scaler .npy file paths (populated after compute_scalars_merra_prism.py).
  scalers:
    inputs_mean: ./examples/MERRA_PRISM/scalars/inputs_mean.npy
    inputs_std: ./examples/MERRA_PRISM/scalars/inputs_std.npy
    targets_mean: ./examples/MERRA_PRISM/scalars/targets_mean.npy
    targets_std: ./examples/MERRA_PRISM/scalars/targets_std.npy

  # Grid sizes (set after inspecting data; adjust as needed).
  input_size_lat: 32
  input_size_lon: 32
  target_size_lat: 256
  target_size_lon: 256
  train_crop_size_lat: 256
  train_crop_size_lon: 256
  downsample_factor: 8

  # Number of input time-steps per sample.
  n_input_timestamps: 1

  # Regridding method (bilinear | conservative | nearest_s2d).
  regrid_method: bilinear

# --- Date ranges ----------------------------------------------------------
dates:
  training:
    start: "2000-01-01"
    end: "2019-12-31"
  inference:
    start: "2020-01-01"
    end: "2023-12-31"

# --- Normalization / predictand configuration -----------------------------
normalization:
  predictor_method: standardize   # standardize | minmax
  target_method: per_variable     # per_variable (see predictands block)

predictands:
  ppt:
    name: ppt
    allow_negative_value: false
    nonnegativity:
      enabled: true
      method: softplus
    scaling:
      method: divide_only
      scale_stat: p95
      fixed_scale: null
    normalization:
      method: divide_only
      mode: global
      eps_std: 1.0e-06
      allow_negative_value: false
  tmax:
    name: tmax
    allow_negative_value: false
    nonnegativity:
      enabled: false
      method: none
    scaling:
      method: zscore
      scale_stat: mean
      fixed_scale: null
    normalization:
      method: standardize
      mode: gridpoint
      eps_std: 1.0e-06
  tmin:
    name: tmin
    allow_negative_value: false
    nonnegativity:
      enabled: false
      method: none
    scaling:
      method: zscore
      scale_stat: mean
      fixed_scale: null
    normalization:
      method: standardize
      mode: gridpoint
      eps_std: 1.0e-06

# --- Model ----------------------------------------------------------------
model:
  input_mu: ./examples/MERRA_PRISM/scalars/inputs_mean.npy
  input_sigma: ./examples/MERRA_PRISM/scalars/inputs_std.npy
  target_mu: ./examples/MERRA_PRISM/scalars/targets_mean.npy
  target_sigma: ./examples/MERRA_PRISM/scalars/targets_std.npy
  embed_dim: 1024
  n_blocks_encoder: 8
  mlp_multiplier: 4
  n_heads: 16
  dropout_rate: 0.0
  drop_path: 0.0
  residual: none
  num_static_channels: 0
  downscaling_patch_size:
    - 2
    - 2
  downscaling_embed_dim: 512
  encoder_decoder_type: conv
  encoder_decoder_upsampling_mode: pixel_shuffle
  encoder_decoder_kernel_size_per_stage:
    - - 3
    - - 3
  encoder_decoder_scale_per_stage:
    - - 2
    - - 3
  encoder_decoder_conv_channels: 128
  residual_connection: true
  encoder_shift: false
  unet: true
  decoder_upsampling_mode: bilinear
  output_scaler_resize_mode: bilinear
  output_scaler_align_corners: false
  unet_upsample_scales:
    - 2
    - 2
    - 2
  unet_decoder_kernel_size:
    - 3
    - 3
    - 3

# --- Training -------------------------------------------------------------
job_id: MERRA_PRISM
type_training: full_dataset
batch_size: 32
num_epochs: 10
dl_num_workers: 2
dl_prefetch_size: 1
learning_rate: 5.0e-05
limit_steps_train: 100000
limit_steps_valid: 100
min_lr: 1.0e-06
max_lr: 0.0001
warm_up_steps: 0
mask_unit_size:
  - 16
  - 16
mask_ratio_inputs: 0.0
mask_ratio_targets: 0.0
max_batch_size: 4

# Run / checkpoint directories.
path_experiment: ./examples/MERRA_PRISM/experiments
checkpoint_dir: ./examples/MERRA_PRISM/experiments/checkpoints
run_dir: ./examples/MERRA_PRISM/experiments/runs

# Pre-trained backbone weights (update to your local path).
path_model_weights: ./granite-geospatial-wxc-downscaling/ECCC/weights/best_rmse_UNET_small.pt
backbone_use: true
backbone_freeze: false
backbone_prefix: "encoder."
finetune_w_static: false
strict_matching: false
device_target: cuda

# Distributed / FSDP settings.
distributed_strategy: fsdp
fsdp_precision: bf16
fsdp_min_num_params: 5000000
backbone_gradient_checkpointing: true
skip_activation_offload: true

training:
  distributed: fsdp
  num_gpus: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 32
  auto_resume_if_checkpoint_exists: false

gradient_accumulation_steps: 32

# --- Loss -----------------------------------------------------------------
loss:
  base: rmse
  predictands:
    ppt:
      distribution_loss:
        enabled: false
        method: cdf
        weight: 0.0
        bins: 100
    tmax:
      distribution_loss:
        enabled: true
        method: cdf
        weight: 0.05
        use_mean: true
        use_std: true
        use_skewness: false
        bins: 100
    tmin:
      distribution_loss:
        enabled: true
        method: cdf
        weight: 0.05
        use_mean: true
        use_std: true
        use_skewness: false
        bins: 100
  spatial_gradient:
    enabled: true
    weight: 0.03
    predictands:
      tmax: 1.0
      tmin: 1.0
      ppt: 0.25
    precipitation_wet_only: true
    precipitation_wet_threshold: 0.1
  use_gradient_loss: true
  gradient_loss_weight: 0.03
  use_tv_loss: false
  tv_loss_weight: 0.0005
  use_multiscale_loss: true
  multiscale_loss_weight: 0.015
  tv:
    enabled: false
    weight: 0.0005
    predictands:
      ppt: 0.1
      tmax: 0.3
      tmin: 0.3
  multiscale:
    enabled: true
    weight: 0.015
    scales:
      - 2
      - 4
    loss_type: l1
  boundary_continuity:
    enabled: true
    weight: 0.01
    predictands:
      ppt: 0.2
      tmax: 1.0
      tmin: 1.0
    stride_lat: 16
    stride_lon: 16
    match_target: true

# --- Inference ------------------------------------------------------------
inference:
  checkpoint_path: null   # auto-detected from run_dir; or set explicitly
  output_dir: ./examples/MERRA_PRISM/experiments/inference_output
  boundary_mitigation:
    enabled: true
    tile_size:
      - 96
      - 96
    overlap:
      - 32
      - 32
    blend_mode: hann
    deblock:
      enabled: false
      boundary_width: 2
      strength: 0.1
      kernel_size: 3
    force_full_frame: false
    blend_window: hann
    blend_sigma: 0.35
    use_seam_deblocking: false
    seam_deblocking_strength: 0.1
  inference_tile_size:
    - 96
    - 96
  inference_overlap:
    - 32
    - 32
  inference_blend_window: hann
  inference_blend_sigma: 0.35
  force_full_frame: false
  use_seam_deblocking: false
  seam_deblocking_strength: 0.1

# --- Precipitation model --------------------------------------------------
precip_model: hurdle
precip_wet_threshold: 0.01
precip_occurrence_prob_threshold: 0.5
precip_lambda_occurrence: 1.0
precip_lambda_amount: 1.0
precip_amount_loss_type: smoothl1

resume_training: false
resume_checkpoint_path: null
auto_resume_if_checkpoint_exists: false
